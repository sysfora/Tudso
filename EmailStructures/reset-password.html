<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset your {APP_NAME} password</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;color:#1a1a1e;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;">
    <tr>
      <td align="center" style="padding:40px 20px;">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;">
          <tr>
            <td style="padding:0 0 28px;">
              <img src="https://tudso.com/brand/icon.png" width="48" height="48" alt="{APP_NAME}" style="display:block;border:0;">
            </td>
          </tr>
          <tr>
            <td style="font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:22px;font-weight:600;letter-spacing:-0.02em;line-height:1.2;color:#1a1a1e;">
              Reset your password
            </td>
          </tr>
          <tr>
            <td style="padding-top:10px;font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:1.5;color:#6d6d76;">
              Choose a new password for your {APP_NAME} account. This link expires in 30 minutes.
            </td>
          </tr>
          <tr>
            <td style="padding-top:28px;">
              <a href="https://tudso.com/auth/reset-password?token={TOKEN}" style="display:inline-block;background:#5b5fee;color:#ffffff;font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:13px;font-weight:600;line-height:40px;padding:0 18px;text-decoration:none;border-radius:8px;">
                Reset password
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding-top:28px;font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:12px;line-height:1.5;color:#8a8a94;">
              If the button does not work, open this link:<br>
              <a href="https://tudso.com/auth/reset-password?token={TOKEN}" style="color:#5b5fee;text-decoration:underline;">https://tudso.com/auth/reset-password?token={TOKEN}</a>
            </td>
          </tr>
          <tr>
            <td style="padding-top:28px;font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:12px;line-height:1.5;color:#8a8a94;">
              If you did not ask to reset your password, you can ignore this email.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
