<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login from a new location</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;color:#1a1a1e;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;">
    <tr>
      <td align="center" style="padding:40px 20px;">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;">
          <tr>
            <td style="padding:0 0 28px;">
              <img src="https://tudso.com/brand/icon.png" width="48" height="48" alt="{APP_NAME}" style="display:block;border:0;">
            </td>
          </tr>
          <tr>
            <td style="font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:22px;font-weight:600;letter-spacing:-0.02em;line-height:1.2;color:#1a1a1e;">
              New sign-in to {APP_NAME}
            </td>
          </tr>
          <tr>
            <td style="padding-top:10px;font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:1.5;color:#6d6d76;">
              We noticed a login from a new location:
            </td>
          </tr>
          <tr>
            <td style="padding-top:16px;font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:1.5;color:#1a1a1e;">
              {ALERT_INFO}
            </td>
          </tr>
          <tr>
            <td style="padding-top:28px;font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:1.5;color:#1a1a1e;">
              If this was not you, reset your password in Tudso to sign out other devices.
            </td>
          </tr>
          <tr>
            <td style="padding-top:28px;font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:12px;line-height:1.5;color:#8a8a94;">
              If this was you, you can ignore this email.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
