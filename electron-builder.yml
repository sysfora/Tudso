appId: com.sysfora.tudso
productName: Tudso
directories:
  output: release
  buildResources: resources
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
files:
  - dist
  - dist-electron
  - node_modules/koffi/**/*
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
asarUnpack:
  - node_modules/koffi/**/*
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
extraResources:
  - from: server/public/icon.png
    to: icon.png
  - from: public/icon.ico
    to: icon.ico
win:
  icon: public/icon.ico
  target:
    - nsis
afterPack: scripts/after-pack.cjs
mac:
  icon: server/public/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  darkModeSupport: true
  extendInfo:
    NSMicrophoneUsageDescription: Tudso uses the microphone for voice input and live copilot.
    NSCameraUsageDescription: Tudso may use the camera if you share it.
    NSAudioCaptureUsageDescription: Tudso captures system audio for live copilot.
linux:
  icon: server/public/icon.png
  target:
    - AppImage
  category: Utility
  synopsis: A lightweight floating desktop AI assistant
  desktop:
    entry:
      StartupWMClass: tudso
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Tudso
protocols:
  - name: Tudso
    schemes:
      - tudso
publish:
  provider: generic
  url: https://tudso.com/downloads
