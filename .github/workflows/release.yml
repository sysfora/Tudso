name: Release

# Builds Windows, macOS, and Linux, stamps the version, POSTs installers to
# https://tudso.com/internal/releases, and publishes a GitHub release.
# Public downloads: /download  Files: /downloads
#
# Version: tag v1.2.3, or workflow input, or a patch bump from package.json.
# After publish, the same version is committed back to the default branch.
#
# Upload token: GitHub secret RELEASE_UPLOAD_TOKEN (same value as Dokploy).
# If the secret lives on a named Environment (not Repository secrets), set
# repository variable RELEASE_ENVIRONMENT to that environment's exact name.
# Default environment: production.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (empty = bump patch, e.g. 1.0.0 → 1.0.1)'
        required: false
        type: string
      environment:
        description: 'GitHub Environment that holds RELEASE_UPLOAD_TOKEN'
        required: false
        default: production
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: true

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: node scripts/set-release-version.mjs --print-only

  build:
    name: Package ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            builder: --win
          - os: ubuntu-22.04
            label: Linux
            builder: --linux
          - os: macos-latest
            label: macOS
            builder: --mac
    steps:
      - uses: actions/checkout@v4

      - name: Stamp release version
        run: node scripts/set-release-version.mjs ${{ needs.version.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Linux packaging packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfuse2 libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Build desktop app
        env:
          MODE: production
          NODE_ENV: production
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL || 'https://tudso.com' }}
          VITE_APP_NAME: Tudso
        run: npm run build:desktop

      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder ${{ matrix.builder }} --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: tudso-${{ matrix.label }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.AppImage
            release/*.yml
            release/*.yaml

  publish:
    name: Publish installers
    needs: [version, build]
    runs-on: ubuntu-latest
    # Environment secrets are empty unless this job names the environment.
    environment: ${{ github.event.inputs.environment || vars.RELEASE_ENVIRONMENT || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write download manifest
        run: node scripts/write-release-manifest.mjs artifacts "${{ needs.version.outputs.version }}"

      - name: Check upload token
        env:
          RELEASE_UPLOAD_TOKEN: ${{ secrets.RELEASE_UPLOAD_TOKEN || vars.RELEASE_UPLOAD_TOKEN }}
          RELEASE_ENVIRONMENT: ${{ github.event.inputs.environment || vars.RELEASE_ENVIRONMENT || 'production' }}
        run: |
          if [ -z "$RELEASE_UPLOAD_TOKEN" ]; then
            echo "RELEASE_UPLOAD_TOKEN is empty in environment '$RELEASE_ENVIRONMENT'."
            echo "Put it in Settings → Environments → $RELEASE_ENVIRONMENT → Environment secrets,"
            echo "or in Settings → Secrets and variables → Actions → Repository secrets."
            echo "If your environment has a different name, set repository variable RELEASE_ENVIRONMENT to that name."
            exit 1
          fi

      - name: Upload installers to server
        env:
          RELEASE_UPLOAD_TOKEN: ${{ secrets.RELEASE_UPLOAD_TOKEN || vars.RELEASE_UPLOAD_TOKEN }}
          API_URL: ${{ vars.VITE_SERVER_URL || 'https://tudso.com' }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          API_URL="${API_URL%/}"
          form=(-F "version=$VERSION")
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            form+=(-F "files=@$f")
          done
          curl --fail-with-body --retry 2 --retry-delay 5 --max-time 1800 \
            -H "Authorization: Bearer $RELEASE_UPLOAD_TOKEN" \
            "${form[@]}" \
            "$API_URL/internal/releases"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Tudso ${{ needs.version.outputs.version }}
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-version:
    name: Sync version in repo
    needs: [version, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp release version
        run: node scripts/set-release-version.mjs ${{ needs.version.outputs.version }}

      - name: Commit version files
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json server/package.json server/package-lock.json src/shared/app-version.ts .env.example server/.env.example
          if git diff --cached --quiet; then
            echo "Version $VERSION is already on the default branch"
            exit 0
          fi
          git commit -m "chore: release $VERSION"
          git push
          # workflow_dispatch: the GitHub release step already created this tag.
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "Tag $TAG already exists on remote"
            else
              git tag "$TAG"
              git push origin "$TAG"
            fi
          fi
